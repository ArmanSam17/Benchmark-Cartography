# Publishes the D3 tool (the tool/ folder only) to GitHub Pages on every push to main.
# One-time setup by the repo owner: Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# Upload and deploy are separate jobs on purpose: when deploy-pages runs in the same job right
# after upload-pages-artifact, it can look the artifact up before GitHub has registered it and
# fail with 'No artifacts named "github-pages"' (actions/deploy-pages#451).
name: Deploy tool to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["tool/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the exported data is present
        run: |
          for f in index.html app.js style.css data/questions.json data/models.json data/matrix.bin data/study_set.json; do
            test -s "tool/$f" || { echo "missing tool/$f; run pipeline/08_export_tool.py and commit tool/data"; exit 1; }
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tool

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
